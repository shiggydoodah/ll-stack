  # deepmerge-ts<8.0.0 recurses with no cycle detection, so two values that self-reference at
  # the same property path merge until Node throws RangeError: Maximum call stack size
  # exceeded (GHSA-ggr8-5vv4-36mx / CVE-2026-40345, high, CWE-674).
  #
  # This is the ONLY override here that crosses a MAJOR boundary to reach its fix, so the
  # usual "bound it to the major the advisory was audited against" rule cannot apply — 8.0.0
  # IS that major. There is no 7.x backport and there will not be one: the advisory lists
  # 8.0.0 as the sole patched version, and 7.1.6 (published five days before it) is a
  # types-only fix for index signatures, with no cycle-detection code in its dist. Updating
  # the parent is not on offer either — deepmerge-ts reaches this tree through exactly one
  # path, @prisma/config, which pins it EXACT at 7.1.5, and prisma 7.9.1 is the newest
  # stable (8.0.0 is still rc). So a major-crossing override is the only route.
  #
  # Crossing that boundary is safe HERE because the 8.0.0 breaking changes miss the one
  # call site. @prisma/config uses the bare `deepmerge` and nothing else — it hands it to
  # c12 as the `merger` for loading prisma.config.ts (apps/backend/prisma.config.ts), at
  # CLI/build time, over local trusted config objects. Against that usage 7.1.5 -> 8.0.1 is
  # a drop-in: identical module format ("type": "module" + main ./dist/index.cjs + the same
  # exports map), identical engines (node >=16), zero runtime deps, and a purely ADDITIVE
  # runtime export list. Of the four documented breaks, three cannot bite — two are type
  # renames (DeepMergeIntoFunctionUtils, DeepMergeMetaMetaData) and one is a deepmergeInto
  # mutation fix, and @prisma/config imports no types and never calls deepmergeInto. The
  # fourth is a real default-behaviour change — Map values are now deep-merged instead of
  # last-value-wins — which is inert for plain-object config files.
  # Worth knowing for the next reader: 8.0.0's fix is a `maxDepth` that defaults to 1000 and
  # SILENTLY TRUNCATES to last-value-wins rather than throwing, and the bare `deepmerge`
  # takes no options object, so that default is not overridable. Config trees nowhere near
  # 1000 levels deep, so it does not matter here — but it would matter for any future
  # dependent that merges deeply nested user data through this same forced copy.
  #
  # Selector scoped to the vulnerable range and nothing in the workspace declares
  # deepmerge-ts directly, so it cannot downgrade a direct dep. Bounded to <9: 8.x is the
  # line the fix landed on and the only line reviewed above, and a 9.x arriving unreviewed
  # on a lockfile refresh would land straight in the Prisma CLI path.
  'deepmerge-ts@<8.0.0': '>=8.0.0 <9'
