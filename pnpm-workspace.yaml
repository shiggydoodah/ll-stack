  # dev-time client generator), which hard-pins js-yaml with no upstream release that
  # bumps it — 1.4.4 / openapi-ts 0.99.0 are both latest — so an override is the only fix
  # available. 4.3.0 → 4.3.1 is a same-major patch.
  # Bounded to <5 because the load-nyc-config safety argument was only ever audited
  # against v4 — unbounded, this override resolves to the newest published major on
  # every lockfile refresh, and had already floated load-nyc-config onto js-yaml 5.
